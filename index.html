<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Donald's Garage STL viewer.">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; worker-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
  <meta name="theme-color" content="#171717">
  <title>Donald's Garage — STL Viewer</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
  <script src="./boot.js" defer></script>
</head>
<body>
  <main aria-label="STL viewer">
    <div id="dropzone">
      <label for="file-input" class="visually-hidden">Choose an STL file</label>
      <input id="file-input" type="file" accept=".stl" disabled>
    </div>
    <p id="status" role="status" aria-live="polite" aria-atomic="true" hidden></p>
    <div id="viewport" aria-label="3D preview" aria-busy="false">
      <div id="viewport-message" hidden></div>
      <div id="drop-overlay" hidden>Drop STL</div>
    </div>
    <noscript><p>Enable JavaScript to preview STL files.</p></noscript>
  </main>
</body>
</html>
